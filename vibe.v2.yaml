# This repository's contract configuration (vibe.yaml version 2, spec
# 0052). vibe.yaml stays version 1 for the old audit until #111 makes the
# contract audit the required check and renames this file to vibe.yaml.
# The contract-audit workflow runs `vibe audit --static --config vibe.v2.yaml`.
contract: 1.0.0
platforms: [linux, windows]
agents: [claude, codex]
# No components: one Go component at the root, found from go.mod.
entrypoints:
  # The tasks ci.yml runs, one per job, so the audit checks each one.
  verify:
    - task fmt:check
    - task typecheck
    - task lint
    - task test
    - task mod:verify
    - task security
    - task workflows:lint
  verify-fast: task verify:fast
  fmt: task fmt
  fmt-check: task fmt:check
