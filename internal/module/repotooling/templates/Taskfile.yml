version: "3"

# Repository-specific tasks — build, run, deploy, whatever this repository
# happens to need — belong in a project-owned Taskfile.local.yml, which
# VibeConform never writes, reads, or audits. The include is optional: with
# no such file it does nothing. Tasks defined there are available
# unprefixed, but cannot redefine a task below — Task exits 203 on a name
# collision rather than silently overriding, so the verification interface
# stays what the standard says it is. Requires Task v3.39.0 or newer.
# See docs/decisions/0009-managed-file-local-extension.md.
includes:
  local:
    taskfile: ./Taskfile.local.yml
    optional: true
    flatten: true
  # VibeConform's own tasks (task audit), kept out of this file so that
  # removing VibeConform is deleting Taskfile.vibe.yml, not editing this
  # one. Optional for the same reason: with the file gone, this include
  # does nothing. See docs/specs/0022-conformance-isolation.md.
  vibe:
    taskfile: ./Taskfile.vibe.yml
    optional: true
    flatten: true

# Task's built-in shell (mvdan.cc/sh) interprets POSIX-style syntax
# identically on Windows/Linux/macOS, so these commands need no per-OS
# branching.

tasks:
  fmt:
    desc: Apply gofmt/goimports formatting.
    cmds:
      - gofmt -l -w .
      - goimports -l -w .

  fmt:check:
    desc: Fail if any file is not gofmt/goimports formatted (CI-safe, no writes).
    cmds:
      - test -z "$(gofmt -l .)"
      - test -z "$(goimports -l .)"

  lint:
    desc: Run go vet and golangci-lint.
    cmds:
      - go vet ./...
      - golangci-lint run

  typecheck:
    desc: Type-check by building all packages (Go has no separate typechecker).
    cmds:
      - go build ./...

  test:
    desc: Run the test suite.
    cmds:
      - go test ./...

  test:race:
    desc: Run the test suite with the race detector.
    cmds:
      - go test -race ./...

  mod:verify:
    desc: Ensure go.mod/go.sum are tidy and modules are verified.
    cmds:
      - go mod tidy
      - go mod verify
      - git diff --exit-code -- go.mod go.sum

  security:
    desc: Run vulnerability scanning.
    cmds:
      - govulncheck ./...

  workflows:lint:
    desc: Validate GitHub Actions workflow files.
    cmds:
      - actionlint

  # Called by Claude Code and Codex, not by people: .claude/settings.json
  # and .codex/hooks.json run "task -x hook:guard" before every shell
  # command and file edit. No desc, so it stays out of task --list. The -x
  # in that command matters: without it Task reports the guard's deny
  # (exit 2) as 201, and both agents treat 201 as allow. The name is
  # reserved like every task here. See
  # docs/specs/0021-agent-hooks-task-interface.md.
  #
  # "|| exit 2" turns any failure inside the task into a deny rather than
  # an allow: go run reports a program's exit 2 as 1, and a missing or
  # broken runtime would otherwise let every tool call through.
  hook:guard:
    silent: true
    cmds:
      - go run .claude/hooks/guard.go .claude/hooks/policy.json || exit 2

  verify:
    desc: Local verification gate — native language tooling only, never
      VibeConform itself; "task audit" is VibeConform's check, which CI
      runs in its own Conformance workflow. Race detection needs a C compiler (CGO); run
      "task test:race" separately if you have one — CI runs it
      independently in its own job.
    cmds:
      - task: fmt:check
      - task: typecheck
      - task: lint
      - task: test
      - task: mod:verify
      - task: security
      - task: workflows:lint

  verify-ci:
    desc: Alias used by CI so the workflow and local docs never drift.
    cmds:
      - task: verify
