# Project-level Codex CLI configuration.
# Verified against current OpenAI Codex documentation at bootstrap time
# (learn.chatgpt.com/docs/config-file, .../docs/hooks). Only loaded when
# this project directory is trusted.

approval_policy = "on-request"
sandbox_mode = "workspace-write"

# Codex hooks are suspended (VibeConform spec 0024, ADR 0011): .codex/hooks.json
# is generated with no hooks. "hooks = false" is deliberately not set, so hooks
# you configure in your own ~/.codex/ keep running.
