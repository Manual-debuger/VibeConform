name: CI

# Every job below runs a Taskfile target so CI, local dev, and docs never
# duplicate independent command lists. See Taskfile.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"

jobs:
  lint:
    name: format / lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before Setup Node: its pnpm cache needs pnpm on PATH. The version
      # comes from package.json's packageManager field, which the
      # repository owns (docs/specs/0020-prod-ts-pnpm.md).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: task fmt:check
        run: task fmt:check
      - name: task lint
        run: task lint

  typecheck_test:
    name: typecheck / test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Before Setup Node: its pnpm cache needs pnpm on PATH. The version
      # comes from package.json's packageManager field, which the
      # repository owns (docs/specs/0020-prod-ts-pnpm.md).
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@${{ env.TASK_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: task typecheck
        run: task typecheck
      - name: task test
        run: task test

  gate:
    name: CI / gate
    if: always()
    needs: [lint, typecheck_test]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        run: |
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.typecheck_test.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
