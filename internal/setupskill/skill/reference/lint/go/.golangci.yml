# golangci-lint v2. `task lint` runs `go vet ./...` and `golangci-lint run`,
# and verify fails on any finding. go vet catches the contract's planted
# static-analysis defect (a Printf call whose arguments do not match its
# format); the linters below add to it. Adapt the list to the team's rules,
# but keep govet.
version: "2"

run:
  timeout: 5m
  # golangci-lint takes one lock per machine. Without this, a run that
  # overlaps another one (an agent hook, a second worktree) exits 3.
  allow-serial-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - errorlint
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    # A nolint directive names its linters and says why (V-08): a bare
    # //nolint would hide every finding on its line. Unused directives
    # are reported too.
    nolintlint:
      require-specific: true
      require-explanation: true
    # A complexity limit catches the contract's planted complexity defect
    # (V-06, a function of cyclomatic complexity 42 and cognitive
    # complexity 41). Existing code over the limits gets a specific
    # suppression with the reason "baseline: pre-existing complexity",
    # not a higher limit.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      excludes:
        - G104 # errcheck already covers unhandled errors
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
