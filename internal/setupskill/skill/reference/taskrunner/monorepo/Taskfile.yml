version: "3"

# The root of a monorepo with three components: services/api (Go),
# apps/web (TypeScript) and services/worker (Python), the same as
# vibe.yaml's components. Each component has its own Taskfile.yml,
# included below under a short id: "task api:test" runs one component's
# task, and "task test" here runs it for every component. The
# repository's own tasks (build, run, deploy) go in this file too. Needs
# Task v3.39.0 or newer.

includes:
  api:
    taskfile: ./services/api/Taskfile.yml
    dir: ./services/api
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web
  worker:
    taskfile: ./services/worker/Taskfile.yml
    dir: ./services/worker

tasks:
  # Installs every component's locked dependencies. Declare it as the
  # setup entrypoint in vibe.yaml, so that the audit's probe copy has
  # node_modules and a virtual environment.
  setup:
    desc: Install every component's locked dependencies.
    cmds:
      - task: web:setup
      - task: worker:setup

  fmt:
    desc: Apply every component's formatter.
    cmds:
      - task: api:fmt
      - task: web:fmt
      - task: worker:fmt

  fmt:check:
    desc: Fail if any component's files are not formatted (CI-safe, no writes).
    cmds:
      - task: api:fmt:check
      - task: web:fmt:check
      - task: worker:fmt:check

  lint:
    desc: Run every component's linters.
    cmds:
      - task: api:lint
      - task: web:lint
      - task: worker:lint

  typecheck:
    desc: Type-check every component.
    cmds:
      - task: api:typecheck
      - task: web:typecheck
      - task: worker:typecheck

  test:
    desc: Run every component's test suite.
    cmds:
      - task: api:test
      - task: web:test
      - task: worker:test

  # Skipped (Task's status: holds) where there is no .github/workflows, as
  # on GitLab CI, whose reference CI does not install actionlint.
  workflows:lint:
    desc: Validate GitHub Actions workflow files.
    status:
      - test ! -d .github/workflows
    cmds:
      - actionlint

  # The agent hooks. .claude/settings.json calls them as
  # "task -x hook:<name>": without -x, Task reports a script's exit 2 as
  # 201, and Claude Code shows the model only exit 2. No desc, so they
  # stay out of task --list. Task runs each cmd with errexit, so every
  # command that can fail on a healthy machine ends in "|| true" or
  # "|| echo missing".
  #
  # Session start: a few lines of facts for the agent's context. It never
  # installs, builds, tests or starts anything, and changes no file.
  hook:context:
    silent: true
    cmds:
      - |
        if git rev-parse --git-dir >/dev/null 2>&1; then
          echo "Repo: {{base .ROOT_DIR}}"
        else
          echo "Repo: {{base .ROOT_DIR}} (not a git repository)"
        fi
        echo "Platform: {{OS}}/{{ARCH}}"
        runtime=native
        if test -e /proc/sys/fs/binfmt_misc/WSLInterop; then
          runtime=wsl
        elif test -e /.dockerenv || test -e /run/.containerenv; then
          runtime=container
        fi
        echo "Runtime: $runtime"
        git rev-parse --git-dir >/dev/null 2>&1 || exit 0
        gitdir="$(git rev-parse --path-format=absolute --git-dir 2>/dev/null || true)"
        common="$(git rev-parse --path-format=absolute --git-common-dir 2>/dev/null || true)"
        [ "$gitdir" = "$common" ] || echo "Worktree: linked (main checkout at ${common%/.git})"
        b="$(git branch --show-current 2>/dev/null || true)"
        [ -n "$b" ] || b="detached at $(git rev-parse --short HEAD 2>/dev/null || echo "an unborn branch")"
        echo "Branch: $b"
        status="$(git status --short 2>/dev/null || true)"
        state=clean
        [ -z "$status" ] || state=dirty
        for p in rebase-merge:rebase rebase-apply:rebase MERGE_HEAD:merge CHERRY_PICK_HEAD:cherry-pick REVERT_HEAD:revert BISECT_LOG:bisect; do
          if [ -e "$(git rev-parse --git-path "${p%%:*}")" ]; then state="$state, ${p#*:} in progress"; fi
        done
        echo "State: $state"
        echo "Go: $(go env GOVERSION 2>/dev/null || echo missing)"
        echo "Node: $(node --version 2>/dev/null || echo missing)"
        echo "pnpm: $(pnpm --version 2>/dev/null || echo missing)"
        echo "uv: $(uv --version 2>/dev/null || echo missing)"
        py="$(uv python find 2>/dev/null || true)"
        echo "Python: $([ -n "$py" ] && "$py" --version 2>/dev/null || echo missing)"
        echo "Task: {{.TASK_VERSION}}"
        echo "Components (task <id>:<task>):"
        echo "  api: services/api (go)"
        echo "  web: apps/web (typescript)"
        echo "  worker: services/worker (python)"
        n=0
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          n=$((n+1))
          [ "$n" -le 20 ] && list="$list$line
        "
        done <<EOF
        $status
        EOF
        echo "Dirty files: $n"
        printf '%s' "$list"
        [ "$n" -le 20 ] || echo "… and $((n-20)) more"

  # After each file edit, in the background: verify:fast's checks except
  # fmt:check, which the PostToolUse hook's fmt covers. Output goes to stderr, which is
  # what the agent is shown.
  # An edit outside the repository (the agent's memory, its scratchpad) or
  # of a file git ignores cannot change the checks' result, so it runs
  # nothing. The path comes from the payload's file_path or notebook_path,
  # JSON-escaped; git reads doubled backslashes as one. git check-ignore
  # exits 0 for an ignored path, 1 for any other path in the repository
  # and 128 outside it. Without a path (a malformed payload, a tool with no
  # path) or a repository, the checks run.
  hook:check:
    silent: true
    cmds:
      - |
        in="$(cat)"
        p=""
        case "$in" in
          *'"file_path":"'*) p="${in#*\"file_path\":\"}" ;;
          *'"file_path": "'*) p="${in#*\"file_path\": \"}" ;;
          *'"notebook_path":"'*) p="${in#*\"notebook_path\":\"}" ;;
          *'"notebook_path": "'*) p="${in#*\"notebook_path\": \"}" ;;
        esac
        case "$p" in
          *'"'*) p="${p%%\"*}" ;;
          *) p="" ;;
        esac
        if [ -n "$p" ] && git rev-parse --git-dir >/dev/null 2>&1; then
          rc=0
          git check-ignore -q -- "$p" 2>/dev/null || rc=$?
          [ "$rc" -eq 1 ] || exit 0
        fi
        task -s api:typecheck api:lint api:test web:typecheck web:lint web:test worker:typecheck worker:lint worker:test 1>&2 || exit 2

  # Runs only when the Stop hook's verify:fast fails:
  # "task verify:fast 1>&2 </dev/null || task -x hook:done". It blocks the
  # stop once. If the agent stops again with the checks still failing
  # (stop_hook_active), the stop goes through, so the agent cannot loop
  # forever on something it cannot fix.
  hook:done:
    silent: true
    cmds:
      - |
        case "$(cat)" in
          *'"stop_hook_active":true'*|*'"stop_hook_active": true'*)
            echo "hook:done: verify:fast still fails; this stop was already blocked once, so it goes through." >&2
            exit 0
            ;;
        esac
        echo "hook:done: verify:fast fails; fix it before ending the turn." >&2
        exit 2

  verify:
    desc: Full verification gate for every component, then the workflow files.
    cmds:
      - task: api:verify
      - task: web:verify
      - task: worker:verify
      - task: workflows:lint

  # What the agents' Stop hook and pre-push run: every component's own
  # verify:fast.
  verify:fast:
    desc: Every component's fast incremental verification.
    cmds:
      - task: api:verify:fast
      - task: web:verify:fast
      - task: worker:verify:fast
