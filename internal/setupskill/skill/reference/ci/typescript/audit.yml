name: Audit

# .github/workflows/audit.yml: the contract audit in a job of its own. It
# is the only CI job that runs vibe; removing VibeConform is deleting this
# file. The job does not call verify itself: vibe audit runs verify and
# verify-fast in a probe copy (after the setup entrypoint, such as
# `pnpm install --frozen-lockfile`), and the guard probes through the
# hooks in .claude/settings.json. So it sets up every tool the entrypoints
# call, and the setup action installs vibe and vibe-guard.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      # The setup action installs vibe and vibe-guard {{VIBE_VERSION}} from
      # the release and checks their checksums. Replace the zeros with the
      # commit SHA of that release tag:
      #   git ls-remote https://github.com/Manual-debuger/VibeConform refs/tags/{{VIBE_VERSION}}
      - name: Install vibe and vibe-guard
        uses: Manual-debuger/VibeConform@0000000000000000000000000000000000000000 # {{VIBE_VERSION}}
        with:
          version: "{{VIBE_VERSION}}"
      - name: vibe audit
        run: vibe audit
