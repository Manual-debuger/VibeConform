# Lefthook: the format check at commit time, fast verification at push time.
# CI (.github/workflows/ci.yml) is the authoritative full verification gate;
# these hooks are a fast local first line of defense, not a substitute.
# Each hook calls a root Taskfile entrypoint, which runs it for every
# component, so the checks live in one place.

pre-commit:
  commands:
    fmt-check:
      glob: "*.{go,js,jsx,ts,tsx,json,css,md,py}"
      run: task fmt:check
      fail_text: "Run 'task fmt' to format every component."

# verify:fast: every component's own verify:fast. The full suite is CI's;
# "task test" runs it by hand.
#
# A pre-push hook started from a linked worktree exports GIT_DIR, so a
# test that runs git would act on the real repository instead of its
# fixture. unset clears Git's repository variables first; lefthook runs
# run: with sh on every platform.
pre-push:
  commands:
    verify-fast:
      run: unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_COMMON_DIR; task verify:fast
