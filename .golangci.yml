version: "2"

run:
  timeout: 5m
  allow-serial-runners: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - depguard
    - errorlint
    - gocognit
    - gocritic
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    # A nolint directive names its linters and says why (V-08): a bare
    # //nolint would hide every finding on its line. Unused directives
    # are reported too.
    nolintlint:
      require-specific: true
      require-explanation: true
    # A complexity limit catches the contract's planted complexity defect
    # (V-06, a function of cyclomatic complexity 42 and cognitive
    # complexity 41). Existing code over the limits gets a specific
    # suppression with the reason "baseline: pre-existing complexity",
    # not a higher limit.
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    # The dependency direction in docs/architecture/overview.md:
    # internal/contract and internal/guard both depend on
    # internal/guardrule, never on each other. (internal/guardrule
    # importing either is an import cycle, which the compiler refuses.)
    # Tests may cross the line: internal/contract's guard probe tests run
    # the real vibe-guard. A trailing $ makes an entry an exact match,
    # so that internal/guard does not also deny internal/guardrule.
    #
    # internal/doctor and internal/setupskill may each import one package
    # of this module (spec 0063). Their rules deny the module path, which
    # matches every package of the module, and allow the one package with
    # a trailing $. They use list-mode lax: an import that matches neither
    # list passes, and when an import matches both lists, the longer entry
    # wins. So the allowed package passes and every other package of the
    # module fails. In the default mode, a non-empty allow list fails
    # every import not in it, the standard library too, and a match in
    # both lists fails. The doctor rule covers its tests too, as the
    # import test it replaces did; it also allows internal/doctor itself,
    # which only the external test package doctor_test can import (spec
    # 0065). The setupskill rule skips tests, as
    # its import test did: the external test package imports
    # internal/setupskill itself.
    depguard:
      rules:
        contract:
          files:
            - "**/internal/contract/**"
            - "!$test"
          deny:
            - pkg: github.com/Manual-debuger/VibeConform/internal/guard$
              desc: the audit checks a guard as a black box; share code through internal/guardrule
        guard:
          files:
            - "**/internal/guard/**"
            - "!$test"
          deny:
            - pkg: github.com/Manual-debuger/VibeConform/internal/contract
              desc: vibe-guard imports only internal/guardrule; share code through internal/guardrule
        doctor:
          list-mode: lax
          files:
            - "**/internal/doctor/**"
          allow:
            - github.com/Manual-debuger/VibeConform/internal/contract$
            - github.com/Manual-debuger/VibeConform/internal/doctor$
          deny:
            - pkg: github.com/Manual-debuger/VibeConform
              desc: vibe doctor reuses the audit's readers and imports no package of this module except internal/contract (spec 0059)
        setupskill:
          list-mode: lax
          files:
            - "**/internal/setupskill/**"
            - "!$test"
          allow:
            - github.com/Manual-debuger/VibeConform/internal/guard$
          deny:
            - pkg: github.com/Manual-debuger/VibeConform
              desc: the setup skill imports no package of this module except internal/guard
    revive:
      rules:
        - name: exported
          disabled: false
    gosec:
      excludes:
        - G104 # errcheck already covers unhandled errors
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports
