standard: prod-mono
version: v1
components:
  - id: api
    path: services/api
    profile: go
  - id: web
    path: apps/web
    profile: ts
    # Committed generator output: not formatted or linted, still
    # type-checked (spec 0037).
    generated:
      - src/contracts/**
  - id: worker
    path: services/worker
    profile: py
    generated:
      - src/example/contracts/**
# Two editors (listing order does not matter) and one agent.
integrations:
  editors: [zed, vscode]
  agents: [claude]
# A workflow gives each component an AGENTS.md section that points to the
# root's (spec 0032).
development:
  workflow: plan-triggered-sdd
