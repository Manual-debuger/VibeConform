standard: prod-mono
version: v1
components:
  - id: api
    path: services/api
    profile: go
  - id: web
    path: apps/web
    profile: ts
  - id: worker
    path: services/worker
    profile: py
# Two editors (listing order does not matter) and one agent.
integrations:
  editors: [zed, vscode]
  agents: [claude]
# A workflow gives each component an AGENTS.md section that points to the
# root's (spec 0032).
development:
  workflow: plan-triggered-sdd
