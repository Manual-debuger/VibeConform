# The standard's Ruff configuration for prod-py/v1, managed by
# VibeConform: vibe sync overwrites this file. Your ruff.toml extends it,
# and its settings win (ADR 0024). Make your changes there.
#
# A file of its own rather than a [tool.ruff] section in pyproject.toml,
# which holds [project] metadata that belongs to the repository. Ruff
# reads ruff.toml in preference to pyproject.toml when both are present.

target-version = "py312"
line-length = 100

# Generated code (vibe.yaml generated:): not formatted or linted, still
# type-checked. force-exclude applies it to files passed explicitly too.
extend-exclude = ["src/example/contracts/**"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100", "DTZ", "S", "BLE"]
# StrEnum changes user-visible str(enum) behavior; migrating API enums needs a product-level review.
ignore = ["UP042"]

[lint.per-file-ignores]
# Assertions are the test contract, not runtime input validation.
"tests/**/*.py" = ["S101"]
