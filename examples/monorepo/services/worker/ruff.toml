# Ruff configuration for prod-py/v1.
#
# Standalone rather than a [tool.ruff] section in pyproject.toml:
# VibeConform owns whole files, and pyproject.toml also holds [project]
# metadata that belongs to the repository. Ruff reads this file in
# preference to pyproject.toml when both are present.

target-version = "py312"
line-length = 100

# Generated code (vibe.yaml generated:): not formatted or linted, still
# type-checked. force-exclude applies it to files passed explicitly too.
extend-exclude = ["src/example/contracts/**"]
force-exclude = true

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100", "DTZ", "S", "BLE"]
# StrEnum changes user-visible str(enum) behavior; migrating API enums needs a product-level review.
ignore = ["UP042"]

[lint.per-file-ignores]
# Assertions are the test contract, not runtime input validation.
"tests/**/*.py" = ["S101"]
