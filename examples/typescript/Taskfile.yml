version: "3"

# Repository-specific tasks — build, run, deploy, whatever this repository
# happens to need — belong in a project-owned Taskfile.local.yml, which
# VibeConform never writes, reads, or audits. The include is optional: with
# no such file it does nothing. Tasks defined there are available
# unprefixed, but cannot redefine a task below — Task exits 203 on a name
# collision rather than silently overriding, so the verification interface
# stays what the standard says it is. Requires Task v3.39.0 or newer.
# See docs/decisions/0009-managed-file-local-extension.md.
includes:
  local:
    taskfile: ./Taskfile.local.yml
    optional: true
    flatten: true
  # VibeConform's own tasks (task audit), kept out of this file so that
  # removing VibeConform is deleting Taskfile.vibe.yml, not editing this
  # one. Optional for the same reason: with the file gone, this include
  # does nothing. See docs/specs/0022-conformance-isolation.md.
  vibe:
    taskfile: ./Taskfile.vibe.yml
    optional: true
    flatten: true

# Task's built-in shell (mvdan.cc/sh) interprets POSIX-style syntax
# identically on Windows/Linux/macOS, so these commands need no per-OS
# branching.

tasks:
  # Scoped to source extensions, not ".": Prettier auto-detects a parser for
  # any file type it recognizes, including the YAML this standard's other
  # modules generate (Taskfile.yml, lefthook.yml, .github/*, .vibe/*.yaml).
  # Reformatting those is not this repository's job — they are owned by
  # their module template, not by the adopting repository's style.
  #
  # Every cache below lives under node_modules, which a Node repository
  # already ignores, so nothing shows up in git status (spec 0023). A cold
  # CI checkout has no cache and checks everything.
  fmt:
    desc: Apply Prettier formatting.
    cmds:
      - pnpm exec prettier --write --cache "**/*.{js,jsx,ts,tsx,json,css,md}"

  fmt:check:
    desc: Fail if any file is not Prettier-formatted (CI-safe, no writes).
    cmds:
      - pnpm exec prettier --check --cache "**/*.{js,jsx,ts,tsx,json,css,md}"

  # ESLint's cache does not track dependencies between files, so a
  # type-aware rule can report a stale result locally until the file itself
  # changes. CI starts cold and is unaffected.
  lint:
    desc: Run eslint.
    cmds:
      - pnpm exec eslint . --cache --cache-location node_modules/.cache/eslint/

  typecheck:
    desc: Type-check with tsc, emitting nothing.
    cmds:
      - pnpm exec tsc --noEmit --incremental --tsBuildInfoFile node_modules/.cache/tsc/tsbuildinfo

  test:
    desc: Run the test suite.
    cmds:
      - pnpm test

  # Called by Claude Code and Codex, not by people: .claude/settings.json
  # and .codex/hooks.json run "task -x hook:guard" before every shell
  # command and file edit. No desc, so it stays out of task --list. The -x
  # in that command matters: without it Task reports the guard's deny
  # (exit 2) as 201, and both agents treat 201 as allow. The name is
  # reserved like every task here. See
  # docs/specs/0021-agent-hooks-task-interface.md.
  #
  # "|| exit 2" turns any failure inside the task into a deny rather than
  # an allow: go run reports a program's exit 2 as 1, and a missing or
  # broken runtime would otherwise let every tool call through.
  hook:guard:
    silent: true
    cmds:
      - node .claude/hooks/guard.mjs .claude/hooks/policy.json || exit 2

  verify:
    desc: Local verification gate — native language tooling only, never
      VibeConform itself; "task audit" is VibeConform's check, which CI
      runs in its own Conformance workflow.
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test

  # The agents' Stop hook and background check run this after edits (spec
  # 0023). For prod-ts it is all of verify, made incremental by the caches
  # above; it exists so every standard offers the same name.
  verify:fast:
    desc: Fast incremental verification (cached format, lint, typecheck,
      then test); what the agents' Stop hook runs. Same steps as verify.
    cmds:
      - task: fmt:check
      - task: lint
      - task: typecheck
      - task: test

  verify-ci:
    desc: Alias used by CI so the workflow and local docs never drift.
    cmds:
      - task: verify
