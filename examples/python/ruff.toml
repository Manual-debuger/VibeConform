# Ruff: formatting (`ruff format`) and lint (`ruff check`) in one file.
#
# A file of its own rather than a [tool.ruff] section in pyproject.toml,
# which holds [project] metadata. Ruff reads ruff.toml in preference to
# pyproject.toml when both are present. The F rules catch a reference to
# an undefined name, the contract's planted static-analysis defect.

target-version = "py312"
line-length = 100
# The setup skill's directories hold reference configs, not the
# repository's code: vibe init --skill rewrites them, and Ruff would read
# the reference ruff.toml there as a nested project.
extend-exclude = [".claude/skills/vibeconform-setup", ".agents/skills/vibeconform-setup"]

[lint]
# PGH003 and PGH004 refuse a blanket "# type: ignore" or "# noqa" (V-08):
# a suppression names its codes. Ruff cannot require a reason, so write
# one after them: "# noqa: S607  # git is found on PATH on purpose".
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF100", "DTZ", "S", "BLE", "C901", "PGH003", "PGH004"]
# StrEnum changes user-visible str(enum) behavior; migrating API enums needs a product-level review.
ignore = ["UP042"]

# C901 is the complexity limit that catches the contract's planted
# complexity defect (V-06, a function of cyclomatic complexity 42). A
# function already over the limit gets a specific suppression with a
# reason, `# noqa: C901  # baseline: pre-existing complexity`, not a
# higher limit. Ruff cannot require the reason, so review asks for it.
[lint.mccabe]
max-complexity = 15

[lint.per-file-ignores]
# Assertions are the test contract, not runtime input validation.
"tests/**/*.py" = ["S101"]
