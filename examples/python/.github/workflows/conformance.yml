name: Conformance

# VibeConform's own check, and the only workflow that runs vibe. Every
# language job lives in ci.yml and never depends on it (spec 0017). If this
# repository stops using VibeConform, delete this file together with
# Taskfile.vibe.yml, vibe.yaml, and .vibe/ — nothing else refers to it.
# See docs/specs/0022-conformance-isolation.md and docs/usage.md's
# "Removing VibeConform".
#
# A managed file edited directly instead of through its module template
# fails here: vibe audit exits 2 for drift, 1 if it could not answer.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    # Named in full, like CI / gate, so the required-check name branch
    # protection needs is exactly this string.
    name: Conformance / audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exactly the vibe that last synced this repository, so CI's verdict
      # cannot change without a change to this repository (spec 0022).
      - name: Read vibe_version
        id: state
        run: |
          v=$(sed -n 's/^vibe_version: *//p' .vibe/state.yaml | tr -d '\r')
          if [ -z "$v" ]; then
            echo ".vibe/state.yaml records no vibe_version; run vibe sync and commit it."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # The setup action (spec 0054) installs that version: from its
      # release, checksums checked, with no Go; or, for a pseudo-version,
      # which has no release, built from the tagged source inside the
      # action. In VibeConform itself, source auto builds vibe from the
      # checkout instead, so a pull request's template changes are not
      # compared with the previous release's templates
      # (docs/decisions/0008-self-hosting-probe-in-shipped-templates.md).
      - name: Install vibe
        uses: Manual-debuger/VibeConform@2890f68098db08a6bdcb5daa0d6a06fedeef1fd7 # setup action
        with:
          version: ${{ steps.state.outputs.version }}
          tools: vibe
          source: auto
      - name: vibe audit
        run: vibe audit --repo-root .
