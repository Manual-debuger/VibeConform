name: Audit

# .github/workflows/audit.yml: the contract audit in a job of its own. It
# is the only CI job that runs vibe; removing VibeConform is deleting this
# file. The job does not call verify itself: vibe audit runs verify and
# verify-fast in a probe copy (after the setup entrypoint, such as
# `uv sync --frozen`), and the guard probes through the hooks in
# .claude/settings.json. So it sets up every tool the entrypoints call,
# and the setup action installs vibe and vibe-guard.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      # The setup action installs vibe and vibe-guard v0.14.0-alpha.1 from
      # the release and checks the archives against its checksums.txt.
      # version must be an exact release such as v0.12.0-alpha.1, never
      # latest: the action refuses it. Where this file says latest (it came
      # from a vibe built from source), use the newest release tag instead,
      # here and in the pin and its comment; list the tags with
      #   git ls-remote --tags https://github.com/Manual-debuger/VibeConform
      # The other inputs keep their defaults: tools (vibe vibe-guard),
      # source (auto: the release for a release version), verify-attestation
      # (false) and checksums (the release's own). Replace the zeros with the
      # commit SHA of that release tag:
      #   git ls-remote https://github.com/Manual-debuger/VibeConform refs/tags/v0.14.0-alpha.1
      # gitleaks for the secrets task in verify: a pinned release, checked
      # against its SHA-256 before it runs.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          case "$RUNNER_OS" in
            Windows) asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip" sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
            *) asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$sum  $dir/$asset" | sha256sum -c -
          case "$asset" in
            *.zip) unzip -q -o "$dir/$asset" gitleaks.exe -d "$dir" ;;
            *) tar -xzf "$dir/$asset" -C "$dir" gitleaks ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"
      - name: Install vibe and vibe-guard
        uses: Manual-debuger/VibeConform@eda947fa48662feb799762b2570af2974e4501eb # v0.14.0-alpha.1
        with:
          version: "v0.14.0-alpha.1"
      - name: vibe audit
        run: vibe audit
