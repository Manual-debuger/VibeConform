name: CI

# .github/workflows/ci.yml for a Python repository managed with uv. CI
# calls the verify entrypoint (`task verify`) on Linux and Windows, on pull
# requests and on pushes to the default branch. No Go toolchain: Task comes
# from its own setup action. Every `uses:` is pinned to a full commit SHA,
# and every tool to an exact version. Change main if the default branch has
# another name.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.53.1
      - name: Install dependencies
        run: uv sync --frozen
      # gitleaks for the secrets task in verify: a pinned release, checked
      # against its SHA-256 before it runs.
      - name: Install gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          case "$RUNNER_OS" in
            Windows) asset="gitleaks_${GITLEAKS_VERSION}_windows_x64.zip" sum=d29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e ;;
            *) asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" sum=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$sum  $dir/$asset" | sha256sum -c -
          case "$asset" in
            *.zip) unzip -q -o "$dir/$asset" gitleaks.exe -d "$dir" ;;
            *) tar -xzf "$dir/$asset" -C "$dir" gitleaks ;;
          esac
          echo "$dir" >> "$GITHUB_PATH"
      - name: task verify
        run: task verify

  # The vulnerability scan: pip-audit checks the locked dependencies, not
  # the project itself.
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: uv tool install pip-audit==2.9.0
      - name: Export the locked requirements
        run: uv export --frozen --no-hashes --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
      - name: pip-audit
        run: pip-audit -r "$RUNNER_TEMP/requirements.txt"
