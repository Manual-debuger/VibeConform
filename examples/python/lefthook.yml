# Lefthook: fast checks at commit time, stronger checks at push time.
# CI is the authoritative full verification gate;
# these hooks are a fast local first line of defense, not a substitute.

# Repository-specific hooks go in lefthook.local.yml (optional, yours;
# see VibeConform's docs/usage.md). Lefthook merges it over this file.
extends:
  - lefthook.local.yml

pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "*.py"
      run: uv run ruff format --check {staged_files}
      fail_text: "Run 'task fmt' to format staged Python files."
    ruff-lint:
      glob: "*.py"
      run: uv run ruff check {staged_files}

pre-push:
  parallel: false
  commands:
    typecheck:
      run: uv run pyright
    test:
      run: uv run pytest

post-commit:
  commands:
    graphify-update:
      run: task graph:update

post-checkout:
  commands:
    graphify-update:
      run: task graph:update
