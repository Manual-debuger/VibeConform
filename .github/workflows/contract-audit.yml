name: Contract

# The contract audit (spec 0052) beside the old one in conformance.yml. It
# is repository-owned, not generated, so adopters do not receive it, and it
# is not a required check until #111 makes it one.
#
# Two jobs. "Contract / audit" runs the full audit (spec 0053) and passes
# on exit 0. "Contract / audit (static)" is the quick one: `vibe audit
# --static` never reaches a verdict (exit 1), since execution checks and
# probes do not run. It passes when no MUST rule failed or could not be
# decided; MUST rules that did not run are expected.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # The full audit (spec 0053): every static, execution and probe part of
  # contract 1.0.0, in a probe copy. It runs verify and verify-fast several
  # times, the guard corpus through the PreToolUse hook, and the Stop hook,
  # so it builds vibe and vibe-guard and installs every tool the
  # entrypoints in vibe.v2.yaml call, as ci.yml does. verify runs the
  # tests, whose Python and TypeScript probe fixtures need uv and pnpm;
  # VIBE_TEST_REQUIRE_TOOLS turns their skip into a failure. It passes on
  # exit 0 (conformant) and is not a required check until #111.
  full:
    name: Contract / audit
    runs-on: ubuntu-latest
    # Expected well under 30 minutes: one full verify (go test ./...) in the
    # probe copy, then mostly cached reruns with one planted defect each,
    # the guard corpus and D-01. 60 leaves twice that (spec 0053).
    timeout-minutes: 60
    env:
      VIBE_TEST_REQUIRE_TOOLS: bash,uv,pnpm,python,node
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The tools vibe.v2.yaml's entrypoints call, pinned as in ci.yml.
      - name: Install the entrypoints' tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: vibe audit
        run: vibe audit --config vibe.v2.yaml


  audit:
    name: Contract / audit (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build vibe from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: vibe audit --static
        run: vibe audit --static --config vibe.v2.yaml || true
      - name: No MUST rule fails or is undecided
        run: |
          vibe audit --static --json --config vibe.v2.yaml > "$RUNNER_TEMP/contract.json" || true
          jq -e '.schema == 1' "$RUNNER_TEMP/contract.json" > /dev/null
          bad=$(jq -r '.rules[] | select(.level == "MUST" and (.result == "fail" or .result == "undecided")) | .id' "$RUNNER_TEMP/contract.json")
          if [ -n "$bad" ]; then
            echo "MUST rules that fail or cannot be decided: $bad"
            exit 1
          fi
