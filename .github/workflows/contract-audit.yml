name: Contract

# The contract audit (spec 0052) of this repository. Adopters get their
# own audit job from the setup skill's reference audit.yml.
#
# Two jobs. "Contract / audit" runs the full audit (spec 0053) and passes
# on exit 0; it is a required check, next to CI / gate (spec 0059).
# "Contract / audit (static)" is the quick one, and not required: `vibe
# audit --static` never reaches a verdict (exit 1), since execution checks
# and probes do not run. It passes when no MUST rule, and no rule
# vibe.yaml requires, failed or could not be decided; rules that did not
# run are expected.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  # The full audit (spec 0053): every static, execution and probe part of
  # contract 1.0.0, in a probe copy. It runs verify and verify-fast several
  # times, the guard corpus through the PreToolUse hook, and the Stop hook,
  # so it builds vibe and vibe-guard and installs every tool the
  # entrypoints in vibe.yaml call, as ci.yml does. verify runs the
  # tests, whose Python and TypeScript probe fixtures need uv and pnpm;
  # VIBE_TEST_REQUIRE_TOOLS turns their skip into a failure. It passes on
  # exit 0 (conformant) and is a required check (spec 0059).
  full:
    name: Contract / audit
    runs-on: ubuntu-latest
    # Expected well under 30 minutes: one full verify (go test ./...) in the
    # probe copy, then mostly cached reruns with one planted defect each,
    # the guard corpus and D-01. 60 leaves twice that (spec 0053).
    timeout-minutes: 60
    env:
      VIBE_TEST_REQUIRE_TOOLS: bash,uv,pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The tools vibe.yaml's entrypoints call, gitleaks for the secrets
      # task among them, at the versions the install-tools action pins.
      - name: Install the entrypoints' tools
        uses: ./.github/actions/install-tools
        with:
          tools: task goimports golangci-lint govulncheck actionlint gitleaks
      # The SHOULD rules this repository meets (spec 0061, acceptance
      # criterion 7) are in vibe.yaml's require list, so the verdict counts
      # them like MUST rules (spec 0063). The step runs vibe audit itself,
      # not task audit: C-04 needs a step that does.
      - name: vibe audit
        run: vibe audit


  audit:
    name: Contract / audit (static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build vibe from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # One run: the summary and the gate both read its JSON report.
      - name: No MUST or required rule fails or is undecided
        run: |
          report="$RUNNER_TEMP/contract.json"
          vibe audit --static --json > "$report" || true
          jq -e '.schema == 1' "$report" > /dev/null
          jq -r '"Verdict: \(.verdict) (\(.reason))", (.rules[] | "  \(.id)  \(.level)\(if .required then " (required)" else "" end)  \(.result)", (.findings[]? | "      \(.file): \(.message)"))' "$report"
          bad=$(jq -r '.rules[] | select((.level == "MUST" or .required) and (.result == "fail" or .result == "undecided")) | .id' "$report")
          if [ -n "$bad" ]; then
            echo "MUST or required rules that fail or cannot be decided: $bad"
            exit 1
          fi
