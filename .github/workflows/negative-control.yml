name: Negative control

# Spec 0061, "Negative control": each planted sample of contract 1.2.0
# must fail only because of its own defect kind. Each job copies one
# example into a fresh Git repository, switches off only the gate that
# catches one kind (for V-06, the complexity linters), runs the full
# audit and requires that rule to fail in every component the switched
# off gate covered. A sample that tripped an unrelated lint rule would
# still fail verify there, and the rule would pass.
#
# It checks VibeConform's samples, not the examples' code, so it runs
# when a pull request changes the samples, the setup skill's references
# or the examples, weekly, and on demand. The changes job decides that,
# not a paths filter: R-01 lets only a job that runs on every pull
# request (C-04) call vibe.

on:
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: negative-control-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.5"
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: Samples, references or examples changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Compare with the base branch
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$BASE"...HEAD |
            grep -qE '^(internal/contract/defects[^/]*\.go|internal/setupskill/skill/reference/|examples/|\.github/workflows/negative-control\.yml)'; then
            run=false
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  control:
    name: ${{ matrix.rule }} without its gate, examples/${{ matrix.example }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # components: the components whose gate is switched off, each of
          # which the rule's findings must name.
          - { rule: V-06, example: typescript, components: "." }
          - { rule: V-06, example: python, components: "." }
          - { rule: V-06, example: monorepo, components: "services/api services/worker apps/web" }
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      RULE: ${{ matrix.rule }}
      EXAMPLE: ${{ matrix.example }}
      COMPONENTS: ${{ matrix.components }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup pnpm
        if: matrix.example != 'python'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        if: matrix.example != 'python'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        if: matrix.example != 'typescript'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"
      - name: Install the Go tools the monorepo's entrypoints call
        if: matrix.example == 'monorepo'
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Only the targeted gate goes: each sed must change its file, or the
      # control would prove nothing.
      - name: Copy the example and switch off the gate
        run: |
          copy="$RUNNER_TEMP/example"
          cp -R "examples/$EXAMPLE" "$copy"
          cd "$copy"
          off() {
            before=$(cat "$2")
            sed -i -e "$1" "$2"
            if [ "$before" = "$(cat "$2")" ]; then echo "::error::$RULE: '$1' did not change $2"; exit 1; fi
          }
          eslint_complexity_off() {
            off "s/^      complexity: \['error', 15\],/      complexity: 'off',/" "$1"
            off "s#^      'sonarjs/cognitive-complexity': \['error', 20\],#      'sonarjs/cognitive-complexity': 'off',#" "$1"
          }
          case "$RULE/$EXAMPLE" in
            V-06/typescript) eslint_complexity_off eslint.config.js ;;
            V-06/python) off 's/, "C901"\]/]/' ruff.toml ;;
            V-06/monorepo)
              off '/^    - gocognit$/d; /^    - gocyclo$/d' services/api/.golangci.yml
              off 's/, "C901"\]/]/' services/worker/ruff.toml
              eslint_complexity_off apps/web/eslint.config.js
              ;;
            *) echo "::error::no gate to switch off for $RULE/$EXAMPLE"; exit 1 ;;
          esac
          git init -q -b main
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "example copy without the $RULE gate"
          echo "COPY=$copy" >> "$GITHUB_ENV"
      - name: The rule fails in each component
        working-directory: ${{ env.COPY }}
        run: |
          vibe audit --json > "$RUNNER_TEMP/audit.json" || true
          jq --arg id "$RULE" '.rules[] | select(.id == $id)' "$RUNNER_TEMP/audit.json"
          result=$(jq -r --arg id "$RULE" '.rules[] | select(.id == $id) | .result' "$RUNNER_TEMP/audit.json")
          if [ "$result" != "fail" ]; then echo "::error::$RULE is $result, want fail"; exit 1; fi
          for c in $COMPONENTS; do
            if ! jq -e --arg id "$RULE" --arg c "in component $c with" \
              '.rules[] | select(.id == $id) | .findings | any(.message | contains($c))' "$RUNNER_TEMP/audit.json" >/dev/null; then
              echo "::error::$RULE does not fail in component $c"
              exit 1
            fi
          done
