name: Negative control

# Spec 0061, "Negative control": each planted sample of contract 1.2.0
# must fail its rule only because of its own defect kind. Each job copies
# an example, switches off only the gate that catches one kind, and shows
# that the rule for that kind now fails. It checks VibeConform's samples,
# not an adopter's code, so it runs when the samples, the setup skill's
# references or the examples change, weekly, and on manual dispatch.

on:
  pull_request:
    paths:
      - internal/contract/defects.go
      - internal/contract/checks_defects.go
      - internal/setupskill/skill/reference/**
      - examples/**
      - .github/workflows/negative-control.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: negative-control-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  PYTHON_VERSION: "3.12"

jobs:
  v05-python:
    name: V-05 fails with Pyright switched off (examples/python)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The typecheck task is the only step of verify that runs Pyright.
      - name: Copy the example into a fresh Git repository, Pyright off
        run: |
          copy="$RUNNER_TEMP/example"
          cp -R examples/python "$copy"
          cd "$copy"
          grep -q 'uv run pyright' Taskfile.yml
          sed -i 's/uv run pyright/echo "pyright switched off"/' Taskfile.yml
          git init -q -b main
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "example copy"
          echo "COPY=$copy" >> "$GITHUB_ENV"
      # V-05 is SHOULD, so the verdict may stay conformant: read the
      # report, not the exit code.
      - name: vibe audit
        working-directory: ${{ env.COPY }}
        run: vibe audit > "$RUNNER_TEMP/audit.txt" || true
      - name: V-05 fails on the type error
        run: |
          report="$RUNNER_TEMP/audit.txt"
          cat "$report"
          grep -q '^  V-05  SHOULD  `verify` catches a type error$' "$report"
          grep -q 'did not make it fail: type error$' "$report"
