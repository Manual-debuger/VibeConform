name: Examples

# The examples as whole repositories (spec 0059, Desired Behavior 14 and
# 15). examples/typescript, examples/python and examples/monorepo are
# assembled by hand from the setup skill's reference files
# (internal/setupskill/skill/reference/). Each job copies one example into
# a fresh Git repository, so that it is a repository root as an adopter's
# would be, and runs the full contract audit there with vibe and
# vibe-guard built from this checkout. The audit runs setup, verify,
# verify-fast, fmt-check, the hooks and the guard probes in its probe copy,
# so each job installs every tool the example's entrypoints call. A job
# passes on exit 0: the verdict is conformant.
#
# monorepo-gitlab audits the monorepo example with the reference
# .gitlab-ci.yml (and Renovate, and a merge request template) in place of
# its GitHub workflows. The real GitLab pipeline is not run here (#74).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  TASK_VERSION: "v3.53.1"
  GOLANGCI_LINT_VERSION: "v2.13.2"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.34.5"
  PYTHON_VERSION: "3.12"
  # The release the examples' audit.yml and settings.json name in place
  # of the references' {{VIBE_VERSION}}; the GitLab job renders the
  # reference .gitlab-ci.yml with it too.
  VIBE_RELEASE: "v0.14.0-alpha.1"

jobs:
  audit:
    name: examples/${{ matrix.example }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        example: [typescript, python, monorepo]
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      EXAMPLE: ${{ matrix.example }}
    steps:
      # Before the checkout: on Windows, Git's default autocrlf would give
      # the examples CRLF working files, which their format checks
      # (Prettier's endOfLine, gofmt) reject. An adopter's clone follows
      # its own .gitattributes; this copy is made from the checkout.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup pnpm
        if: matrix.example != 'python'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        if: matrix.example != 'python'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        if: matrix.example != 'typescript'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install task
        run: go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"
      - name: Install the Go tools the monorepo's entrypoints call
        if: matrix.example == 'monorepo'
        run: |
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # GOEXE is ".exe" on Windows and empty elsewhere: an extensionless
      # binary is not found by PATH lookup on Windows. First on PATH, so
      # the audit's probes run this checkout's vibe-guard.
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe$(go env GOEXE)" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard$(go env GOEXE)" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Copy the example into a fresh Git repository
        run: |
          copy="$RUNNER_TEMP/example"
          cp -R "examples/$EXAMPLE" "$copy"
          cd "$copy"
          git init -q -b main
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "example copy"
          echo "COPY=$copy" >> "$GITHUB_ENV"
      - name: vibe audit
        working-directory: ${{ env.COPY }}
        run: vibe audit

  monorepo-gitlab:
    name: examples/monorepo (GitLab CI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # No actionlint: without .github/workflows, verify must not need it.
      - name: Install task and the Go tools the entrypoints call
        run: |
          go install github.com/go-task/task/v3/cmd/task@"$TASK_VERSION"
          go install golang.org/x/tools/cmd/goimports@v0.51.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"$GOLANGCI_LINT_VERSION"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Build vibe and vibe-guard from source
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          go build -o "$RUNNER_TEMP/bin/vibe" ./cmd/vibe
          go build -o "$RUNNER_TEMP/bin/vibe-guard" ./cmd/vibe-guard
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # The reference GitLab files in place of .github/: .gitlab-ci.yml
      # with the release named, Renovate for D-02, and the merge request
      # template for R-03.
      - name: Copy the example into a fresh Git repository, on GitLab CI
        run: |
          ref="$PWD/internal/setupskill/skill/reference/ci"
          copy="$RUNNER_TEMP/monorepo"
          cp -R examples/monorepo "$copy"
          cd "$copy"
          mv .github "$RUNNER_TEMP/monorepo-github"
          sed "s/{{VIBE_VERSION}}/$VIBE_RELEASE/g" "$ref/monorepo/.gitlab-ci.yml" > .gitlab-ci.yml
          cp "$ref/renovate.json" renovate.json
          mkdir -p .gitlab/merge_request_templates
          cp "$ref/pull_request_template.md" .gitlab/merge_request_templates/Default.md
          git init -q -b main
          git add -A
          git -c user.email=ci@example.com -c user.name=ci commit -q -m "example copy"
          echo "COPY=$copy" >> "$GITHUB_ENV"
      # Spec 0044: GitLab's published schema catches a misspelled keyword or
      # an invalid value. It does not resolve include, extends or rules, and
      # it is no real run (issue #74). The checker version pins the schema.
      - name: GitLab CI schema check
        working-directory: ${{ env.COPY }}
        run: uvx check-jsonschema@0.38.2 --builtin-schema vendor.gitlab-ci --data-transform gitlab-ci .gitlab-ci.yml
      - name: vibe audit (no actionlint on PATH)
        working-directory: ${{ env.COPY }}
        run: |
          if command -v actionlint >/dev/null 2>&1; then echo "actionlint is on PATH"; exit 1; fi
          vibe audit

  gate:
    name: Examples / gate
    if: always()
    needs: [audit, monorepo-gitlab]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        env:
          AUDIT: ${{ needs.audit.result }}
          GITLAB: ${{ needs.monorepo-gitlab.result }}
        run: |
          for result in "$AUDIT" "$GITLAB"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
