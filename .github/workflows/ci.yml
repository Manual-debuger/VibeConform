name: CI

# Every job below runs a Taskfile target so CI, local dev, and docs never
# duplicate independent command lists. See Taskfile.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.0"
  # setup-go caches GOCACHE, which also holds test results: run the tests
  # rather than replay a cached pass. Commands other than go test ignore
  # the flag.
  GOFLAGS: "-count=1"

jobs:
  lint:
    name: format / lint / static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task goimports golangci-lint
      - name: task fmt:check
        run: task fmt:check
      - name: task lint
        run: task lint

  actionlint:
    name: format / lint / static (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task actionlint
      - name: task workflows:lint
        run: task workflows:lint

  mod-tidy:
    name: format / lint / static (go.mod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task
      - name: task mod:verify
        run: task mod:verify

  test:
    name: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task
      - name: task typecheck
        run: task typecheck
      - name: task test
        run: task test

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task
      - name: task test:race
        run: task test:race

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task govulncheck
      - name: task security
        run: task security

  # The secret scan of the working tree (spec 0061, V-07), on both
  # platforms, as the setup skill's references run it.
  secrets:
    name: secrets
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          tools: task gitleaks
      - name: task secrets
        run: task secrets

  gate:
    name: CI / gate
    if: always()
    needs: [lint, actionlint, mod-tidy, test, race, security, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Require all upstream jobs to have succeeded
        run: |
          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.actionlint.result }}" \
            "${{ needs.mod-tidy.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.race.result }}" \
            "${{ needs.security.result }}" \
            "${{ needs.secrets.result }}"; do
            if [ "$result" != "success" ]; then
              echo "A required job did not succeed: $result"
              exit 1
            fi
          done
