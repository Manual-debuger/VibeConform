version: "3"

# Project-owned, and deliberately not managed by VibeConform: these tasks
# build and run this repository's own CLI, which is exactly the kind of
# thing a standard has no business asserting for every adopter. They lived
# in prod-go/v1's Taskfile.yml template until spec 0018 moved them here.
# See docs/decisions/0009-managed-file-local-extension.md.
#
# Tasks here are merged into the generated Taskfile.yml unprefixed, so
# "task build" works as before. Defining a task the generated file already
# defines is a hard error (Task exits 203), not an override.

tasks:
  build:
    desc: Build the vibe binary into ./bin, stamped so its version orders.
    cmds:
      # An unstamped build reports "dev", which is not valid semver, so
      # state.CompareWriters cannot order it and spec 0019's downgrade guard
      # stays dormant on exactly the binary a contributor uses. Stamping a
      # Go-style pseudo-version fixes that: it sorts above the release it
      # descends from, so running a stale ~/go/bin release against state
      # this build wrote is recognised as a downgrade and refused.
      #
      # Raw "git describe" output would NOT work here. Semver compares
      # prerelease identifiers lexically, so v0.2.0-alpha.1-42-gAAA sorts
      # BELOW -9-gBBB — see docs/decisions/0010-semver-comparison-dependency.md.
      - |
        sha=$(git rev-parse --short=12 HEAD 2>/dev/null || echo unknown)
        ts=$(git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S HEAD 2>/dev/null || echo 00000000000000)
        tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        case "$tag" in
          "")  base="v0.0.0-" ;;
          *-*) base="$tag.0." ;;
          *)   n=${tag#v}; patch=${n##*.}; head=${n%.*}
               base="v$head.$((patch+1))-0." ;;
        esac
        version="$base$ts-$sha"
        git diff --quiet HEAD 2>/dev/null || version="$version+dirty"
        go build -ldflags "-X main.version=$version" -o bin/vibe ./cmd/vibe
        echo "built bin/vibe $version"

  run:
    desc: 'Run the CLI, e.g. task run -- --help.'
    cmds:
      - go run ./cmd/vibe {{.CLI_ARGS}}
